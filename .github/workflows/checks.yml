name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Treemap geometry
        run: node test_treemap.cjs
      - name: Release privacy checks
        run: python scripts/check_release.py
